name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      typecheck: ${{ steps.detect.outputs.typecheck }}
      build: ${{ steps.detect.outputs.build }}
      desktop_launch: ${{ steps.detect.outputs.desktop_launch }}
      test: ${{ steps.detect.outputs.test }}
      test_packages: ${{ steps.detect.outputs.test_packages }}
      test_web: ${{ steps.detect.outputs.test_web }}
      test_server: ${{ steps.detect.outputs.test_server }}
      rust: ${{ steps.detect.outputs.rust }}
      js_checks: ${{ steps.detect.outputs.js_checks }}
      release_smoke: ${{ steps.detect.outputs.release_smoke }}
      mobile_native: ${{ steps.detect.outputs.mobile_native }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          sparse-checkout: |
            /pnpm-workspace.yaml
            /.github/scripts/ci-changes.cjs
            /.github/actions/ci-changes/
            /*/package.json
            /*/*/package.json
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Detect affected jobs
        id: detect
        uses: ./.github/actions/ci-changes

  rust_hygiene:
    name: Rust Gates, Docs & WASM
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/legion-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: cargo-hygiene-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'native/*/Cargo.lock') }}
          restore-keys: |
            cargo-hygiene-${{ runner.os }}-${{ runner.arch }}-

      - name: Install GTK and WebKit2GTK Linux dependencies
        run: |
          sudo apt-get update -o Acquire::Languages=none \
            -o Acquire::IndexTargets::deb::DEP-11::DefaultEnabled=false \
            -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false &&
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config

      - name: Enforce Rust safety and hygiene gates
        run: node rust/scripts/check-rust-gates.mjs

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo fmt --manifest-path "native/$crate/Cargo.toml" --check
          done

      - name: Check Rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --manifest-path rust/Cargo.toml --workspace --no-deps

      - name: Check WASM crate compilation
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --target wasm32-unknown-unknown -p legion-wasm-ffi -- -D warnings

  rust_test:
    name: Rust Clippy & Tests (${{ matrix.label }})
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux
            native_crates: resource-monitor kde-snap-shot hyprland-snap-shot
          - os: macos-15
            label: macOS
            native_crates: resource-monitor
          - os: windows-2025
            label: Windows
            native_crates: resource-monitor
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/legion-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.100.0"
          components: clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
            native/resource-monitor/target/
          key: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'native/*/Cargo.lock') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Install GTK and WebKit2GTK Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Languages=none \
            -o Acquire::IndexTargets::deb::DEP-11::DefaultEnabled=false \
            -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false &&
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libwayland-dev pkg-config xvfb

      - name: Clippy Rust workspace
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1 \
              xvfb-run -a cargo test --locked --manifest-path rust/Cargo.toml --workspace
          else
            cargo test --locked --manifest-path rust/Cargo.toml --workspace
          fi

      - name: Test native helper crates
        shell: bash
        run: |
          for crate in ${{ matrix.native_crates }}; do
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  rust_cutover:
    name: Rust Dist, Cutover & CLI Smoke
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/legion-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.100.0"
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        id: install_wasm_bindgen
        continue-on-error: true
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: wasm-bindgen-cli@0.2.130

      - name: Fallback install wasm-bindgen-cli via GitHub CLI
        if: steps.install_wasm_bindgen.outcome != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BIN_DIR="${CARGO_HOME:-$HOME/.cargo}/bin"
          mkdir -p "$BIN_DIR"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          ARCHIVE="wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz"
          EXPECTED_SHA256="9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f"
          if gh release download 0.2.130 --repo wasm-bindgen/wasm-bindgen --pattern "$ARCHIVE" --dir "$TMP_DIR"; then
            printf '%s  %s/%s\n' "$EXPECTED_SHA256" "$TMP_DIR" "$ARCHIVE" | sha256sum -c -
            tar -xzf "$TMP_DIR/$ARCHIVE" -C "$TMP_DIR"
            BIN_PATH="$(find "$TMP_DIR" -type f -name wasm-bindgen | head -n 1)"
            if [[ -n "$BIN_PATH" ]]; then
              install -m 0755 "$BIN_PATH" "$BIN_DIR/wasm-bindgen"
              echo "$BIN_DIR" >> "$GITHUB_PATH"
              "$BIN_DIR/wasm-bindgen" --version
              exit 0
            fi
          fi
          cargo install --locked wasm-bindgen-cli --version 0.2.130

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
            native/resource-monitor/target/
          key: cargo-cutover-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock', 'native/resource-monitor/Cargo.lock') }}
          restore-keys: |
            cargo-cutover-${{ runner.os }}-${{ runner.arch }}-

      - name: Install GTK and WebKit2GTK Linux dependencies
        run: |
          sudo apt-get update -o Acquire::Languages=none \
            -o Acquire::IndexTargets::deb::DEP-11::DefaultEnabled=false \
            -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false &&
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Build Rust dist bundles
        run: node rust/scripts/build-dist.mjs

      - name: Smoke test WASM and Worker surfaces
        run: node rust/scripts/smoke-wasm-surfaces.mjs

      - name: Verify Rust cutover checks
        run: bash rust/cutover.sh verify

      - name: Package and smoke standalone CLI archive
        shell: bash
        run: |
          set -euo pipefail
          RUST_VERSION="$(node -e 'const fs = require("node:fs"); const m = fs.readFileSync("rust/Cargo.toml", "utf8").match(/\[workspace\.package\][\s\S]*?\nversion\s*=\s*"([^"]+)"/); if (!m) process.exit(1); console.log(m[1]);')"
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p apps/server/dist-exe apps/server/dist/resource-monitor
          cp rust/dist/bin/legioncode apps/server/dist-exe/legioncode-linux-x64
          cp native/resource-monitor/target/release/legioncode-resource-monitor apps/server/dist/resource-monitor/legioncode-resource-monitor
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$RUST_VERSION" --output-dir release-assets
          node scripts/smoke-cli-archive.ts --archive "release-assets/legioncode-${RUST_VERSION}-linux-x64.tar.gz" --expect-version "$RUST_VERSION"

  js_checks:
    name: Workspace & Bridge Checks
    needs: [changes]
    if: ${{ !cancelled() && (needs.changes.outputs.js_checks == 'true' || needs.changes.outputs.typecheck == 'true' || needs.changes.outputs.release_smoke == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/legion-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Run CI workflow and script tests
        run: node --test .github/scripts/check-nightly-release.test.cjs .github/scripts/test-delta.test.cjs .github/scripts/ci-workflows.test.cjs

      - name: Run Knip and i18n checks
        run: |
          vp run knip:check
          vp run i18n:check

      - name: Check formatting and lint
        run: |
          vp fmt --check
          vp lint

      - name: Run typecheck
        if: needs.changes.outputs.typecheck != 'false'
        run: vp run typecheck

      - name: Run release smoke checks
        if: needs.changes.outputs.release_smoke != 'false'
        run: node scripts/release-smoke.ts

  check:
    name: Check
    if: ${{ always() }}
    needs: [changes, rust_hygiene, rust_test, rust_cutover, js_checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.changes.outputs as $gates
            | {
                rust_hygiene: ["rust"],
                rust_test: ["rust"],
                rust_cutover: ["rust"],
                js_checks: ["js_checks", "typecheck", "release_smoke"]
              } as $mapped
            | all(to_entries[];
                .value.result == "success"
                or (.value.result == "skipped"
                  and (($mapped[.key] // [.key]) | all(.[]; $gates[.] == "false"))))' > /dev/null
