[package]
name = "legion-mobile-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
legion-client-core = { path = "../legion-client-core" }
legion-contracts = { path = "../legion-contracts" }
legion-edge = { path = "../legion-edge" }
legion-shared = { path = "../legion-shared", default-features = false }
legion-surfaces = { path = "../legion-surfaces" }
legion-terminal-vt = { path = "../legion-terminal-vt" }
thiserror = { workspace = true }
