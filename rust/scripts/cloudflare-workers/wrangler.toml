name = "t3code-edge-worker"
main = "worker.mjs"
compatibility_date = "2026-11-01"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

[[d1_databases]]
binding = "INDEX"
database_name = "t3-task-cache-index"
database_id = "00000000-0000-0000-0000-000000000001"

[[d1_databases]]
binding = "SAVINGS"
database_name = "t3-task-cache-savings"
database_id = "00000000-0000-0000-0000-000000000002"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "t3-task-cache-artifacts"

[[r2_buckets]]
binding = "CLIENTS"
bucket_name = "t3-mobile-dev-clients"

[[hyperdrive]]
binding = "RELAY_DB"
id = "00000000-0000-0000-0000-000000000003"

[[durable_objects.bindings]]
name = "HOOK_INBOX"
class_name = "HookInboxObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HookInboxObject"]

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "STORE_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "HOOK_RATE_LIMIT"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

[triggers]
crons = ["* * * * *", "0 * * * *"]
