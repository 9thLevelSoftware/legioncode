name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-nightly.*"
      - "!v*-preview.*"
  schedule:
    # Avoid minute zero, when GitHub scheduled jobs are busiest.
    - cron: "8,38 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: false
        default: preview
        type: choice
        options:
          - preview
          - stable
          - nightly
      version:
        description: "Stable version override (for example 1.2.3). Defaults to the version the latest nightly previewed."
        required: false
        type: string

concurrency:
  group: release-${{ (github.event_name == 'schedule' || inputs.channel == 'nightly' || inputs.channel == 'preview') && 'nightly' || 'stable' }}
  cancel-in-progress: false
  queue: max

permissions:
  actions: read
  contents: read
  id-token: none

jobs:
  resolve_commit:
    name: Resolve release commit
    if: github.event_name != 'schedule' || vars.PAUSE_NIGHTLY != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      nightly_version: ${{ steps.resolve.outputs.nightly_version }}
      has_changes: ${{ steps.resolve.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts

      - id: resolve
        name: Resolve release commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
        with:
          retries: 3
          script: |
            const {
              assertCommitOnDefaultBranch,
              assertReleaseSource,
              shouldReleaseNightly,
              resolveLatestNightlyCommit,
            } = require('./.github/scripts/check-nightly-release.cjs');

            const dispatchChannel = process.env.DISPATCH_CHANNEL || 'preview';
            const releaseChannel = context.eventName === 'schedule'
              ? 'nightly'
              : context.eventName === 'workflow_dispatch'
                ? dispatchChannel
                : 'stable';

            await assertReleaseSource({ github, context, releaseChannel });

            if (context.eventName === 'schedule') {
              core.setOutput('has_changes', await shouldReleaseNightly({ github, context, core }));
              core.setOutput('ref', context.sha);
            } else if (context.eventName === 'workflow_dispatch' && dispatchChannel === 'stable') {
              const { tag, sha, version } = await resolveLatestNightlyCommit({ github, context, core });
              await assertCommitOnDefaultBranch({ github, context, sha });
              core.notice(`Stable release builds ${sha}, the commit shipped by ${tag}.`);
              core.setOutput('ref', sha);
              core.setOutput('nightly_version', version);
            } else {
              core.setOutput('ref', context.sha);
            }

  preflight:
    name: Preflight
    needs: [resolve_commit]
    if: |
      needs.resolve_commit.result == 'success' &&
      (github.event_name != 'schedule' || needs.resolve_commit.outputs.has_changes == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_channel: ${{ steps.release_meta.outputs.release_channel }}
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      release_name: ${{ steps.release_meta.outputs.name }}
      short_sha: ${{ steps.release_meta.outputs.short_sha }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      cli_dist_tag: ${{ steps.release_meta.outputs.cli_dist_tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      ref: ${{ needs.resolve_commit.outputs.ref }}
      npm_launcher_artifact_id: ${{ steps.npm_launcher.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.resolve_commit.outputs.ref }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/legion-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@legioncode/scripts...

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_CHANNEL: ${{ github.event.inputs.channel }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          NIGHTLY_VERSION: ${{ needs.resolve_commit.outputs.nightly_version }}
          NIGHTLY_DATE: ${{ github.run_started_at }}
          NIGHTLY_SHA: ${{ needs.resolve_commit.outputs.ref }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" || ( "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_CHANNEL:-preview}" == "nightly" ) ]]; then
            nightly_date="$(date -u -d "$NIGHTLY_DATE" +%Y%m%d)"
            node scripts/resolve-nightly-release.ts \
              --date "$nightly_date" \
              --run-number "$NIGHTLY_RUN_NUMBER" \
              --sha "$NIGHTLY_SHA" \
              --github-output
            echo "release_channel=nightly" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=nightly" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_CHANNEL:-preview}" == "preview" ]]; then
            nightly_date="$(date -u -d "$NIGHTLY_DATE" +%Y%m%d)"
            node scripts/resolve-nightly-release.ts \
              --channel preview \
              --date "$nightly_date" \
              --run-number "$NIGHTLY_RUN_NUMBER" \
              --sha "$NIGHTLY_SHA" \
              --github-output
            echo "release_channel=preview" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
              raw="${DISPATCH_VERSION:-$NIGHTLY_VERSION}"
              if [[ -z "$raw" ]]; then
                echo "workflow_dispatch stable releases need a version input or a published nightly." >&2
                exit 1
              fi
            else
              raw="${GITHUB_REF_NAME}"
            fi

            version="${raw#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release version: $raw" >&2
              exit 1
            fi

            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "name=LegionCode v$version" >> "$GITHUB_OUTPUT"
            echo "cli_dist_tag=latest" >> "$GITHUB_OUTPUT"
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "make_latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "make_latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - id: previous_tag
        name: Resolve previous release tag
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel "${{ steps.release_meta.outputs.release_channel }}" \
            --current-tag "${{ steps.release_meta.outputs.tag }}" \
            --github-output

      - name: Build npm launcher package
        if: steps.release_meta.outputs.release_channel != 'preview'
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: node scripts/build-npm-launcher.ts --version "$RELEASE_VERSION" --output-dir npm-packages

      - id: npm_launcher
        name: Upload npm launcher package
        if: steps.release_meta.outputs.release_channel != 'preview'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-launcher
          path: npm-packages/legioncode.tgz
          if-no-files-found: error

  quality:
    name: Release quality checks
    needs: [preflight]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/legion-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: cargo-release-quality-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-release-quality-${{ runner.os }}-${{ runner.arch }}-

      - name: Install GTK and WebKit2GTK Linux dependencies
        run: |
          sudo apt-get update -o Acquire::Languages=none \
            -o Acquire::IndexTargets::deb::DEP-11::DefaultEnabled=false \
            -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false &&
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config xvfb

      - name: Setup workspace dependencies
        uses: ./.github/actions/setup-ci-deps

      - name: Enforce Rust safety and hygiene gates
        run: node rust/scripts/check-rust-gates.mjs

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check

      - name: Clippy Rust workspace
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test Rust workspace
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a cargo test --locked --manifest-path rust/Cargo.toml --workspace

      - name: Run release smoke checks
        run: node scripts/release-smoke.ts

  surface_bundles:
    name: Build WASM, Web, Worker & Mobile SDK bundles
    needs: [preflight, quality]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.quality.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/legion-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.100.0"
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: wasm-bindgen-cli@0.2.130

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: cargo-surface-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-surface-${{ runner.os }}-${{ runner.arch }}-

      - name: Install GTK and WebKit2GTK Linux dependencies
        run: |
          sudo apt-get update -o Acquire::Languages=none \
            -o Acquire::IndexTargets::deb::DEP-11::DefaultEnabled=false \
            -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false &&
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config

      - name: Setup script dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@legioncode/scripts...

      - name: Stamp release version and build portable surface bundles
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path rust/Cargo.toml
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
          cargo update --workspace --offline --manifest-path rust/Cargo.toml
          node rust/scripts/build-dist.mjs --surfaces wasm,web-app,cloudflare-workers,mobile-sdk
          node rust/scripts/smoke-wasm-surfaces.mjs
          mkdir -p release-surface-assets
          tar -czf "release-surface-assets/legioncode-web-app-${RELEASE_VERSION}.tar.gz" -C rust/dist web-app
          tar -czf "release-surface-assets/legioncode-wasm-sdk-${RELEASE_VERSION}.tar.gz" -C rust/dist wasm-web wasm-nodejs
          tar -czf "release-surface-assets/legioncode-cloudflare-workers-${RELEASE_VERSION}.tar.gz" -C rust/dist cloudflare-workers
          tar -czf "release-surface-assets/legioncode-mobile-sdk-${RELEASE_VERSION}.tar.gz" -C rust/dist mobile

      - name: Upload portable surface bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-surface-bundles
          path: release-surface-assets/*
          if-no-files-found: error

      - name: Upload web-app dist for target packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-app-dist
          path: rust/dist/web-app
          if-no-files-found: error

  build_target:
    name: Build target (${{ matrix.platform_key }})
    needs: [preflight, quality, surface_bundles]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.quality.result == 'success' && needs.surface_bundles.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_key: linux-x64
            platform: linux
            arch: x64
            exe_key: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            archive_ext: tar.gz
            ext: ""
          - platform_key: linux-arm64
            platform: linux
            arch: arm64
            exe_key: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive_ext: tar.gz
            ext: ""
          - platform_key: darwin-arm64
            platform: mac
            arch: arm64
            exe_key: darwin-arm64
            rust_target: aarch64-apple-darwin
            runner: macos-15
            archive_ext: tar.gz
            ext: ""
          - platform_key: darwin-x64
            platform: mac
            arch: x64
            exe_key: darwin-x64
            rust_target: x86_64-apple-darwin
            runner: macos-15
            archive_ext: tar.gz
            ext: ""
          - platform_key: win32-x64
            platform: win
            arch: x64
            exe_key: win-x64
            rust_target: x86_64-pc-windows-msvc
            runner: windows-2025
            archive_ext: zip
            ext: ".exe"
          - platform_key: win32-arm64
            platform: win
            arch: arm64
            exe_key: win-arm64
            rust_target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            archive_ext: zip
            ext: ".exe"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/legion-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Download web-app dist bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-app-dist
          path: rust/dist/web-app

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
            native/resource-monitor/target/
          key: cargo-target-${{ matrix.platform_key }}-${{ hashFiles('rust/Cargo.lock', 'native/resource-monitor/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ matrix.platform_key }}-

      - name: Install GTK and WebKit2GTK Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Languages=none \
            -o Acquire::IndexTargets::deb::DEP-11::DefaultEnabled=false \
            -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false &&
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config

      - name: Setup script dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@legioncode/scripts...

      - name: Build Rust binaries and FFI libraries
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path rust/Cargo.toml
          cargo fetch --locked --manifest-path native/resource-monitor/Cargo.toml
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION"
          cargo update --workspace --offline --manifest-path rust/Cargo.toml
          cargo build --locked --release --manifest-path rust/Cargo.toml --target "${{ matrix.rust_target }}" -p legion-cli -p legion-desktop-shell -p legion-mobile-ffi
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Package and smoke CLI archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          LEGIONCODE_CLI_MAC_SIGN_IDENTITY: ${{ vars.LEGIONCODE_CLI_MAC_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          set -euo pipefail
          mkdir -p apps/server/dist-exe apps/server/dist/resource-monitor release-target-assets
          cp "rust/target/${{ matrix.rust_target }}/release/legioncode${{ matrix.ext }}" \
            "apps/server/dist-exe/legioncode-${{ matrix.exe_key }}${{ matrix.ext }}"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/legioncode-resource-monitor${{ matrix.ext }}" \
            "apps/server/dist/resource-monitor/legioncode-resource-monitor${{ matrix.ext }}"
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "$RELEASE_VERSION" \
            --output-dir release-target-assets
          if [[ "${{ matrix.platform_key }}" != "darwin-x64" ]]; then
            node scripts/smoke-cli-archive.ts \
              --archive "release-target-assets/legioncode-${RELEASE_VERSION}-${{ matrix.platform_key }}.${{ matrix.archive_ext }}" \
              --expect-version "$RELEASE_VERSION"
          fi

      - name: Package desktop bundle and mobile FFI archives
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          desktop_stem="legioncode-desktop-${RELEASE_VERSION}-${{ matrix.platform_key }}"
          mobile_stem="legioncode-mobile-ffi-${RELEASE_VERSION}-${{ matrix.platform_key }}"
          desktop_dir="desktop-stage/${desktop_stem}"
          mobile_dir="mobile-ffi-stage/${mobile_stem}"
          target_release_dir="rust/target/${{ matrix.rust_target }}/release"

          rm -rf "$desktop_dir" "$mobile_dir"
          mkdir -p "$desktop_dir" "$mobile_dir" release-target-assets

          cp "${target_release_dir}/legioncode-desktop${{ matrix.ext }}" "${desktop_dir}/legioncode-desktop${{ matrix.ext }}"
          if [[ "${{ matrix.platform_key }}" == "darwin-x64" ]]; then
            cargo build --locked --release --manifest-path rust/Cargo.toml -p legion-desktop-shell
            rust/target/release/legioncode-desktop --emit-bundle "$desktop_dir"
            cp "${target_release_dir}/legioncode-desktop" "${desktop_dir}/legioncode-desktop"
          else
            "${desktop_dir}/legioncode-desktop${{ matrix.ext }}" --emit-bundle "$desktop_dir"
          fi

          for lib in \
            liblegion_mobile_ffi.so \
            liblegion_mobile_ffi.dylib \
            liblegion_mobile_ffi.a \
            legion_mobile_ffi.dll \
            legion_mobile_ffi.dll.lib \
            legion_mobile_ffi.lib; do
            if [[ -f "${target_release_dir}/${lib}" ]]; then
              cp "${target_release_dir}/${lib}" "${mobile_dir}/${lib}"
            fi
          done

          if [[ "${{ matrix.archive_ext }}" == "zip" ]]; then
            win_tar="$(cygpath -u "${SYSTEMROOT:-C:\\Windows}\\System32\\tar.exe")"
            "$win_tar" -a -c -f "release-target-assets/${desktop_stem}.zip" -C desktop-stage "$desktop_stem"
            "$win_tar" -a -c -f "release-target-assets/${mobile_stem}.zip" -C mobile-ffi-stage "$mobile_stem"
          else
            tar -czf "release-target-assets/${desktop_stem}.tar.gz" -C desktop-stage "$desktop_stem"
            tar -czf "release-target-assets/${mobile_stem}.tar.gz" -C mobile-ffi-stage "$mobile_stem"
          fi

      - name: Upload target artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-target-${{ matrix.platform_key }}
          path: release-target-assets/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [preflight, surface_bundles, build_target]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.surface_bundles.result == 'success' && needs.build_target.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/legion-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup script dependencies for AI release notes
        if: needs.preflight.outputs.release_channel != 'preview' && env.OPENAI_API_KEY != ''
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@legioncode/scripts...

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            rm -f SHA256SUMS SHA256SUMS.tmp
            sha256sum -- * > SHA256SUMS.tmp
            mv SHA256SUMS.tmp SHA256SUMS
          )
          cat release-assets/SHA256SUMS

      - name: Prepare release notes
        if: needs.preflight.outputs.release_channel != 'preview' && env.OPENAI_API_KEY != ''
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
        run: |
          args=(--tag "$TAG" --output release-notes.md)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(--previous-tag "$PREVIOUS_TAG")
          fi
          node scripts/generate-release-notes.ts "${args[@]}"

      - name: Prepare preview release notes
        if: needs.preflight.outputs.release_channel == 'preview'
        env:
          LATEST_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest
          BUILD_REF: ${{ needs.preflight.outputs.ref }}
        run: |
          printf '%s\n' \
            '> [!CAUTION]' \
            '> **Preview build — not for general use.**' \
            '>' \
            "> Preview builds are cut by maintainers from unreleased branches to exercise the release pipeline. If you want LegionCode, install the [latest release](${LATEST_URL}) or a nightly instead." \
            '' \
            "Built from \`${BUILD_REF}\`." > release-notes.md

      - name: Publish release
        if: needs.preflight.outputs.previous_tag != ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: ${{ hashFiles('release-notes.md') == '' }}
          body_path: ${{ hashFiles('release-notes.md') != '' && 'release-notes.md' || '' }}
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          draft: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: release-assets/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish first release
        if: needs.preflight.outputs.previous_tag == ''
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.release_name }}
          generate_release_notes: ${{ hashFiles('release-notes.md') == '' }}
          body_path: ${{ hashFiles('release-notes.md') != '' && 'release-notes.md' || '' }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          draft: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: release-assets/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}

      - name: Publish prerelease
        if: needs.preflight.outputs.is_prerelease == 'true' && needs.preflight.outputs.release_channel != 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  update_feed:
    name: Check the update feed
    needs: [preflight, release]
    if: ${{ !cancelled() && ((github.event_name == 'schedule' && vars.PAUSE_NIGHTLY != 'true') || needs.preflight.outputs.release_channel == 'nightly') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts

      - id: feed
        name: Read the update feed
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          retries: 3
          script: |
            const { readNightlyUpdateFeed } = require('./.github/scripts/check-nightly-release.cjs');
            const { tag, pointerTag, feedNightly, feedTags } = await readNightlyUpdateFeed({ github, context });
            if (!tag) return;
            core.info(`Newest nightly: ${tag}. Pointer: ${pointerTag}. Feed: ${feedTags?.join(', ')}.`);
            core.setOutput('tag', tag);
            core.setOutput('pointer_stale', pointerTag !== tag);
            core.setOutput('feed', feedTags === undefined ? 'unreadable' : feedNightly === tag ? 'ok' : 'hidden');

      - name: Point the update feed at the newest nightly
        if: steps.feed.outputs.pointer_stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.feed.outputs.tag }}
        run: |
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '{tag_name, name, body}' > nightly.json
          gh release view update-feed > /dev/null 2>&1 ||
            gh release create update-feed --prerelease --latest=false --title "Update feed" \
              --notes "The desktop updater reads this release to find the newest nightly. Do not delete it."
          gh release upload update-feed nightly.json --clobber

      - name: Keep the update feed release public and never latest
        if: steps.feed.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit update-feed --draft=false --prerelease --latest=false

      - name: Fail when the feed hides the newest nightly
        if: steps.feed.outputs.tag != '' && steps.feed.outputs.feed != 'ok'
        env:
          RELEASE_TAG: ${{ steps.feed.outputs.tag }}
          FEED: ${{ steps.feed.outputs.feed }}
        run: |
          if [[ "$FEED" == "unreadable" ]]; then
            echo "::warning::releases.atom could not be read, so this run did not check it."
            exit 0
          fi
          echo "::error::The first nightly in releases.atom is not $RELEASE_TAG."
          exit 1

  publish_cli:
    name: Publish CLI to npm
    needs: [preflight, release]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' && needs.preflight.outputs.release_channel != 'preview' && vars.ENABLE_NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /.github/actions/setup-ci-deps/
            /package.json
            /pnpm-workspace.yaml
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Check the npm launcher artifact ID
        env:
          ARTIFACT_ID: ${{ needs.preflight.outputs.npm_launcher_artifact_id }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::preflight gave no valid npm-launcher artifact ID: '$ARTIFACT_ID'." >&2
            exit 1
          fi

      - name: Download the npm launcher
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.preflight.outputs.npm_launcher_artifact_id }}
          path: npm-packages
          digest-mismatch: error

      - name: Check the npm launcher version
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          built="$(tar -xzOf npm-packages/legioncode.tgz package/package.json | jq -r .version)"
          if [[ "$built" != "$RELEASE_VERSION" ]]; then
            echo "::error::npm-launcher holds legioncode@$built, expected legioncode@$RELEASE_VERSION." >&2
            exit 1
          fi

      - name: Publish the npm launcher
        env:
          DIST_TAG: ${{ needs.preflight.outputs.cli_dist_tag }}
        run: |
          if ! npm publish --access public --tag "$DIST_TAG" --provenance ./npm-packages/legioncode.tgz; then
            echo "::error::npm publish failed. Make sure package legioncode has a trusted publisher registered for .github/workflows/release.yml." >&2
            exit 1
          fi

  publish_aur:
    name: Publish AUR package
    needs: [preflight, release]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' && needs.preflight.outputs.release_channel != 'preview' && vars.ENABLE_AUR_PUBLISH == 'true' }}
    uses: ./.github/workflows/publish-aur.yml
    with:
      release_tag: ${{ needs.preflight.outputs.tag }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  finalize:
    name: Finalize release
    needs: [preflight, release]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.release.result == 'success' && needs.preflight.outputs.release_channel == 'stable' && vars.ENABLE_RELEASE_FINALIZE == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: app_token
        name: Mint release app token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: true
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/legion-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - id: app_bot
        name: Resolve GitHub App bot identity
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.100.0"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@legioncode/scripts... --filter=@legioncode/oxlint-plugin-legioncode...

      - id: update_versions
        name: Update version strings
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cargo fetch --locked --manifest-path rust/Cargo.toml
          node scripts/update-release-package-versions.ts "$RELEASE_VERSION" --github-output
          if [[ -n "$(git status --porcelain -- rust/Cargo.toml)" ]]; then
            cargo update --workspace --offline --manifest-path rust/Cargo.toml
          fi

      - name: Format package.json files
        if: steps.update_versions.outputs.changed == 'true'
        run: vp fmt apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json

      - name: Refresh lockfile
        if: steps.update_versions.outputs.changed == 'true'
        run: vp install --lockfile-only --ignore-scripts

      - name: Commit and push version bump
        if: steps.update_versions.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if git diff --quiet -- apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json rust/Cargo.toml rust/Cargo.lock pnpm-lock.yaml; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "${{ steps.app_bot.outputs.name }}"
          git config user.email "${{ steps.app_bot.outputs.email }}"

          git add apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json rust/Cargo.toml rust/Cargo.lock pnpm-lock.yaml
          git commit --no-verify -m "chore(release): prepare $RELEASE_TAG"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt). Rebasing onto latest main."
            git pull --rebase origin main
          done

          echo "Could not push the version bump after 5 attempts." >&2
          exit 1
